services:
  server:
    build: ./app/server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URL: mongodb://${MONGO_USERNAME:?Set MONGO_USERNAME}:${MONGO_PASSWORD:?Set a URL-safe MONGO_PASSWORD}@database:27017/hr_db?authSource=admin&replicaSet=rs0
      JWT_KEY: ${JWT_KEY:?Generate a JWT_KEY of at least 32 bytes}
      APP_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      UPLOAD_DIR: /app/public/uploads
      TRUST_PROXY_HOPS: "1"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  frontend:
    build: ./app/frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: server
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    depends_on:
      server:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  database:
    image: mongo:8.0@sha256:bdc216e9d5a6ec2cfdac789b5832fdab64cd32055f59885cae918a92de63c361
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/hr/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-key:/data/key
      - ./scripts/mongo-entrypoint.sh:/opt/hr/mongo-entrypoint.sh:ro
      - ./scripts/mongo-health.js:/opt/hr/mongo-health.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "/opt/hr/mongo-health.js"]
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 18
volumes:
  mongo-data:
  mongo-key:
  uploads:
