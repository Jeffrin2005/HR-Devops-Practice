version: '3.8'

services:
  # The Node.js Backend Server
  server:
    build: 
      context: ./app/server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://database:27017/hr_db
      - JWT_KEY=supersecretkey123
      - PORT=5000
    depends_on:
      - database

  # The Vite React Frontend
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

  # MongoDB Database
  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
