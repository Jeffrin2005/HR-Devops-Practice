apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: hr-frontend-chaos
  namespace: default
spec:
  appinfo:
    appns: 'default'
    applabel: 'app=hr-frontend'
    appkind: 'deployment'
  # It can be active or stop
  engineState: 'active'
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            # set chaos duration (in sec) as desired
            - name: TOTAL_CHAOS_DURATION
              value: '30'
            # set chaos interval (in sec) as desired
            - name: CHAOS_INTERVAL
              value: '10'
            # pod failures without force
            - name: FORCE
              value: 'false'
