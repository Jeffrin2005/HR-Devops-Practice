 stroke-width="2.3" marker-end="url(#a)"/><text x="942" y="539" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600">Workload IAM identity</text><text x="310" y="512" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#334155" font-weight="600">Role + ownership checks / validated inputs</text><text x="310" y="539" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">HttpOnly cookies / health probes / resource limits</text><text x="310" y="566" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Dev: authenticated MongoDB and persistent volumes</text><rect x="44" y="661" width="470" height="146" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="44" y="678" width="5" height="28" rx="2" fill="#7c3aed"/><text x="64" y="698" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">Terraform infrastructure</text><text x="64" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">VPC + private subnets + NAT + EKS + IAM</text><text x="64" y="750" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Private versioned S3 uploads bucket</text><text x="64" y="773" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Separate encrypted state per environment</text><rect x="555" y="661" width="490" height="146" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="555" y="678" width="5" height="28" rx="2" fill="#059669"/><text x="575" y="698" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">Monitoring namespace</text><text x="575" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">ServiceMonitor &gt; Prometheus &gt; Grafana</text><text x="575" y="750" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Alert rules &gt; Alertmanager &gt; SMTP</text><text x="575" y="773" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Internal metrics; no public endpoint</text><polyline points="900,598 900,661" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)" stroke-dasharray="6 6"/><text x="913" y="636" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600">Metrics scrape</text><rect x="1080" y="661" width="315" height="146" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="1080" y="678" width="5" height="28" rx="2" fill="#d97706"/><text x="1100" y="698" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">Deployment setup</text><text x="1100" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Real DNS, TLS, and secrets</text><text x="1100" y="750" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Installed charts and CNI</text><text x="1100" y="773" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Verified image digests</text><text x="44" y="861" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569" font-weight="600">Configured target topology. Local validation does not certify a running AWS deployment.</text><text x="44" y="902" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b" font-weight="400">HR Platform / Jeffrin2005/HR-Devops-Practice / Editable source: scripts/render-diagrams.mjs</text></svg>