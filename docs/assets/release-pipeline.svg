idth="1.5"/><rect x="725" y="671" width="5" height="28" rx="2" fill="#d97706"/><text x="745" y="691" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">Argo CD</text><text x="745" y="720" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Supplied Application: dev</text><text x="745" y="743" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Reconcile desired state</text><rect x="1075" y="654" width="320" height="126" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="1075" y="671" width="5" height="28" rx="2" fill="#059669"/><text x="1095" y="691" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">Kubernetes rollout</text><text x="1095" y="720" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Health and readiness probes</text><text x="1095" y="743" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Authenticated smoke checks</text><polyline points="334,717 385,717" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600"></text><polyline points="675,717 725,717" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600"></text><polyline points="1025,717 1075,717" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600"></text><text x="44" y="831" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569" font-weight="600">Terraform provisions infrastructure separately; Argo CD reconciles application manifests from Git.</text><text x="44" y="872" font-family="Ar