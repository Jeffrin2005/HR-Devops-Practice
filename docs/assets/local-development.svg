<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="665" viewBox="0 0 1440 665" role="img"><title>HR Platform - Local application architecture</title><desc>A working environment for learning, developing, and testing the complete application.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.4"/></marker></defs><rect width="1440" height="665" fill="#f5f8fd"/><rect width="1440" height="120" fill="#0f172a"/><text x="44" y="53" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#fff" font-weight="700">HR Platform - Local application architecture</text><text x="44" y="87" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#becde0" font-weight="400">A working environment for learning, developing, and testing the complete application.</text><text x="44" y="169" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2563eb" font-weight="700">DOCKER COMPOSE / LOCAL DEVELOPMENT</text><rect x="44" y="242" width="245" height="145" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="44" y="259" width="5" height="28" rx="2" fill="#0891b2"/><text x="64" y="279" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">Browser</text><text x="64" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">http://localhost:8080</text><text x="64" y="331" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Custom port supported</text><rect x="345" y="242" width="290" height="145" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="345" y="259" width="5" height="28" rx="2" fill="#2563eb"/><text x="365" y="279" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">frontend container</text><text x="365" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Nginx serves React build</text><text x="365" y="331" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Container listens on 8080</text><text x="365" y="354" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">/api proxies to server:5000</text><rect x="690" y="242" width="300" height="145" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="690" y="259" width="5" height="28" rx="2" fill="#2563eb"/><text x="710" y="279" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">server container</text><text x="710" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Express API on port 5000</text><text x="710" y="331" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Cookies + authorization</text><text x="710" y="354" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">MongoDB transactions</text><rect x="1045" y="242" width="350" height="145" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="1045" y="259" width="5" height="28" rx="2" fill="#7c3aed"/><text x="1065" y="279" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">database container</text><text x="1065" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">MongoDB 8 / replica set rs0</text><text x="1065" y="331" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Authentication on port 27017</text><text x="1065" y="354" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Single member: development</text><polyline points="289,314 345,314" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="300" y="299" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600">HTTP</text><polyline points="635,314 690,314" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="642" y="299" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600">/api</text><polyline points="990,314 1045,314" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="1003" y="299" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600">DB</text><rect x="690" y="445" width="300" height="104" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="690" y="462" width="5" height="28" rx="2" fill="#d97706"/><text x="710" y="482" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">uploads volume</text><text x="710" y="511" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Persistent local image files</text><rect x="1045" y="445" width="350" height="104" rx="15" fill="white" stroke="#dbe3ef" stroke-width="1.5"/><rect x="1045" y="462" width="5" height="28" rx="2" fill="#7c3aed"/><text x="1065" y="482" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700">mongo-data + mongo-key</text><text x="1065" y="511" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569" font-weight="400">Database + persistent replica key</text><polyline points="840,387 840,445" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600"></text><polyline points="1220,387 1220,445" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#a)"/><text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" font-weight="600"></text><text x="44" y="465" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a" font-weight="700">Only the frontend is published to localhost.</text><text x="44" y="495" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569" font-weight="400">API and database ports stay on the Compose network.</text><text x="44" y="525" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569" font-weight="400">Ignored .env inputs; explicit administrator bootstrap.</text><text x="44" y="602" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#475569" font-weight="600">Local execution was verified. AWS, ingress TLS, and production S3 are configured separately.</text><text x="44" y="642" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b" font-weight="400">HR Platform / Jeffrin2005/HR-Devops-Practice / Editable source: scripts/render-diagrams.mjs</text></svg>