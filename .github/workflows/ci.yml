name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/frontend/**'
      - 'app/server/**'
  workflow_dispatch: # This adds a manual 'Run Workflow' button in GitHub


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: SonarCloud Scan (Frontend & Backend Code)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Needed to authenticate to SonarCloud
        with:
          args: >
            -Dsonar.organization=your-github-org
            -Dsonar.projectKey=your-project-key
            -Dsonar.sources=app/


      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./app/frontend
          push: true
          tags: jeffrinjojo/hr-frontend:latest, jeffrinjojo/hr-frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./app/server
          push: true
          tags: jeffrinjojo/hr-backend:latest, jeffrinjojo/hr-backend:${{ github.sha }}

      - name: Run Trivy Security Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'jeffrinjojo/hr-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Set to 1 to fail the pipeline if vulnerabilities are found
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Security Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'jeffrinjojo/hr-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Set to 1 to fail the pipeline if vulnerabilities are found
          severity: 'CRITICAL,HIGH'

      - name: Update Kubernetes Manifests
        run: |
          # Replace old image tags with the new GitHub SHA tag
          sed -i "s|image: jeffrinjojo/hr-frontend:.*|image: jeffrinjojo/hr-frontend:${{ github.sha }}|g" k8s/base/frontend-deployment.yaml
          sed -i "s|image: jeffrinjojo/hr-backend:.*|image: jeffrinjojo/hr-backend:${{ github.sha }}|g" k8s/base/backend-deployment.yaml
          
          # Commit the change back to the repository so Argo CD detects it
          git config --global user.name 'GitHub Actions CI'
          git config --global user.email 'actions@github.com'
          git add k8s/base/frontend-deployment.yaml k8s/base/backend-deployment.yaml
          git commit -m "CI: Update frontend and backend image tags to ${{ github.sha }}"
          git push
