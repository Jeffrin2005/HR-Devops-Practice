name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./app/frontend
          push: true
          tags: jeffrinjojo/hr-frontend:latest, jeffrinjojo/hr-frontend:${{ github.sha }}

      - name: Update Kubernetes Manifests
        run: |
          # Replace the old image tag with the new GitHub SHA tag
          sed -i "s|image: jeffrinjojo/hr-frontend:.*|image: jeffrinjojo/hr-frontend:${{ github.sha }}|g" k8s/base/frontend-deployment.yaml
          
          # Commit the change back to the repository so Argo CD detects it
          git config --global user.name 'GitHub Actions CI'
          git config --global user.email 'actions@github.com'
          git add k8s/base/frontend-deployment.yaml
          git commit -m "CI: Update frontend image tag to ${{ github.sha }}"
          git push
