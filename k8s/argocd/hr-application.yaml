apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hr-employee-management-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jeffrin2005/HR-Devops-Practice.git
    path: k8s/overlays/dev
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: hr-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
