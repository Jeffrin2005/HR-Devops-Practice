apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-frontend
  template:
    metadata:
      labels:
        app: hr-frontend
    spec:
      containers:
      - name: frontend-container
        image: jeffrinjojo/hr-frontend:v20
        ports:
        - containerPort: 80
