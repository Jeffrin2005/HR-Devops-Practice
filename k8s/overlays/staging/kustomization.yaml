apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

# In Staging, we want 2 replicas to test load balancing before Prod
patches:
  - target:
      kind: Deployment
      name: hr-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: hr-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
