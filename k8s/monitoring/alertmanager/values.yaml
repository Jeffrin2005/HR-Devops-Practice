# Optional override for k8s/monitoring/values.yaml. Configure real sender/recipient
# addresses locally and create monitoring/hr-alert-smtp with a password key.
alertmanager:
  alertmanagerSpec:
    secrets: [hr-alert-smtp]
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: REPLACE_WITH_SENDER
      smtp_auth_username: REPLACE_WITH_SENDER
      smtp_auth_password_file: /etc/alertmanager/secrets/hr-alert-smtp/password
      smtp_require_tls: true
    route:
      receiver: email-alert
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: email-alert
        email_configs:
          - to: REPLACE_WITH_RECIPIENT
            send_resolved: true
