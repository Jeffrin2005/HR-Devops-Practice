apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    grafana_dashboard: "1"
data:
  hr-app-dashboard.json: |
    {"uid":"hr-app","title":"HR API","schemaVersion":39,"version":1,"panels":[{"id":1,"type":"timeseries","title":"Requests per second","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"refId":"A","expr":"sum by (namespace) (rate(hr_http_requests_total[5m]))"}]},{"id":2,"type":"timeseries","title":"95th percentile latency (seconds)","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"refId":"A","expr":"histogram_quantile(0.95, sum by (le, namespace) (rate(hr_http_request_duration_seconds_bucket[5m])))"}]}]}
