apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: hr.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-frontend-service
                port:
                  number: 80
