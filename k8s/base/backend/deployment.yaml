apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      containers:
      - name: backend-container
        image: jeffrinjojo/hr-backend:d6a15895ad12ad682b3c13cc882a4d5ad381e0a6
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://hr-database-service:27017/hr_db"
        - name: JWT_KEY
          value: "supersecretkey123"

