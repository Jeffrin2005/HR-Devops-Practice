apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-mongo-scripts
data:
  mongo-entrypoint.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    # Docker's Mongo entrypoint drops privileges after initialising the root user.
    if [ ! -s /data/key/replica.key ]; then
      umask 077
      openssl rand -base64 512 > /data/key/replica.key
    fi
    chown mongodb:mongodb /data/key/replica.key
    chmod 400 /data/key/replica.key
    exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/key/replica.key
  mongo-health.js: |
    const admin = db.getSiblingDB('admin');
    if (!admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1);
    try {
      const status = rs.status();
      quit(status.myState === 1 ? 0 : 1);
    } catch (error) {
      if (error.code !== 94) throw error;
      rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: process.env.MONGO_REPLICA_HOST || 'database:27017' }] });
      quit(1);
    }
