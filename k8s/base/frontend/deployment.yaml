apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-frontend
  template:
    metadata:
      labels:
        app: hr-frontend
    spec:
      containers:
      - name: frontend-container
        image: jeffrinjojo/hr-frontend:d6a15895ad12ad682b3c13cc882a4d5ad381e0a6
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

