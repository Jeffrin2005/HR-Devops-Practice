apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-backend
  template:
    metadata:
      labels:
        app: hr-backend
    spec:
      containers:
      - name: backend-container
        image: jeffrinjojo/hr-backend:b3c444fc4ced83954de9de910e4182e415f5f85b
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://hr-database-service:27017/hr_db"
        - name: JWT_KEY
          value: "supersecretkey123"
