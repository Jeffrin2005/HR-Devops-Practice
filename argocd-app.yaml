apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hr-employee-management-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Jeffrin2005/HR-Devops-Practice.git'
    path: k8s/overlays/prod
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
